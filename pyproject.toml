[project]
name = "memory-agent"
version = "0.0.1"
description = "An agent with a tool to save long-term memory."
authors = [
    { name = "William Fu-Hinthorn", email = "13333726+hinthornw@users.noreply.github.com" },
]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "langgraph>=1.0.0",
    # Optional (for selecting different models)
    "langchain-openai>=1.6.2",
    "langchain-anthropic>=1.4.6",
    "langchain>=1.3.10",
    "langchain-core>=1.3.3",
    "python-dotenv>=1.2.2",
    "langgraph-sdk>=0.4.3",
]

[project.optional-dependencies]
dev = ["mypy>=2.3.1", "ruff>=0.16.7"]

[dependency-groups]
dev = [
    "anyio>=4.15.1",
    "langgraph-cli[inmem]>=0.4.31",
    "mypy>=2.3.1",
    "pytest>=9.0.3",
    "ruff>=0.16.7",
]

[build-system]
requires = ["setuptools>=84.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["memory_agent"]
[tool.setuptools.package-dir]
"memory_agent" = "src/memory_agent"
"langgraph.templates.memory_agent" = "src/memory_agent"


[tool.setuptools.package-data]
"*" = ["py.typed"]

[tool.ruff]
lint.select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # isort
    "D",    # pydocstyle
    "D401", # First line should be in imperative mood
    "T201",
    "UP",
]
lint.ignore = ["UP006", "UP007", "UP035", "D417", "E501"]
include = ["*.py", "*.pyi", "*.ipynb"]
[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "UP"]
"ntbk/*" = ["D", "UP", "T201"]
[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
ignore_errors = true
